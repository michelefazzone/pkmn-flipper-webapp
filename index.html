<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PKMN Flipper — Occasioni</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --sec-bg: var(--tg-theme-secondary-bg-color, #232e3c);
      --text: var(--tg-theme-text-color, #f5f5f5);
      --hint: var(--tg-theme-hint-color, #8a99a8);
      --link: var(--tg-theme-link-color, #5ea9dd);
      --btn: var(--tg-theme-button-color, #3390ec);
      --btn-text: var(--tg-theme-button-text-color, #fff);
      --good: #35c759;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); font-size: 15px;
      padding: 0 0 40px;
    }
    header { padding: 12px 14px 6px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
    h1 { font-size: 17px; margin: 0 0 2px; }
    .meta { color: var(--hint); font-size: 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 14px; }
    .controls input, .controls select {
      background: var(--sec-bg); color: var(--text); border: none; border-radius: 8px;
      padding: 8px 10px; font-size: 14px; outline: none;
    }
    #q { flex: 1 1 100%; }
    .seg { display: flex; gap: 6px; }
    .set-group { margin: 6px 0; }
    .set-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: var(--sec-bg); cursor: pointer; user-select: none;
      position: sticky; top: 96px; z-index: 3;
    }
    .set-head .name { font-weight: 600; }
    .set-head .cnt { color: var(--hint); font-size: 12px; }
    .cards { padding: 0 8px; }
    .card {
      display: block; padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,.06);
      color: inherit; text-decoration: none;
    }
    .card .row1 { display: flex; justify-content: space-between; gap: 8px; }
    .card .cn { font-weight: 600; }
    .card .num { color: var(--hint); font-weight: 400; font-size: 12px; }
    .badge { color: var(--good); font-weight: 700; white-space: nowrap; }
    .card .row2 { color: var(--hint); font-size: 12.5px; margin-top: 3px; }
    .price { color: var(--text); }
    .strike { text-decoration: line-through; color: var(--hint); }
    .empty, .error { padding: 40px 20px; text-align: center; color: var(--hint); }
    .hidden { display: none; }
    .addcart {
      background: var(--btn); color: var(--btn-text); border: none; border-radius: 8px;
      font-size: 14px; line-height: 1; padding: 6px 9px; cursor: pointer; flex: none;
    }
    .addcart:disabled { opacity: .55; cursor: default; }
    .addcart.done { background: var(--good); }
    .warn { color: #f0a53c; font-size: 12px; margin-top: 2px; }
    .detail { margin-top: 8px; }
    .detail .info { color: var(--hint); font-size: 12.5px; margin-bottom: 8px; }
    .openct {
      background: var(--sec-bg); color: var(--link); border: none; border-radius: 8px;
      font-size: 13px; padding: 7px 10px; cursor: pointer;
    }
    .gearbtn {
      background: var(--sec-bg); color: var(--text); border: none; border-radius: 8px;
      font-size: 14px; padding: 8px 10px; cursor: pointer;
    }
    .settings { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 8px; }
    .settings.hidden { display: none; }
    .settings input {
      flex: 1 1 auto; background: var(--sec-bg); color: var(--text); border: none;
      border-radius: 8px; padding: 8px 10px; font-size: 14px; outline: none;
    }
    .settings .msg { flex-basis: 100%; color: var(--hint); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>💎 Occasioni Pokémon</h1>
    <div class="meta" id="meta">Caricamento…</div>
    <div class="controls">
      <input id="q" type="search" placeholder="Cerca carta o set…" />
      <div class="seg">
        <select id="lang">
          <option value="">Tutte le lingue</option>
          <option value="EN">EN</option>
          <option value="JP">JP</option>
        </select>
        <select id="sort">
          <option value="margin">Margine €</option>
          <option value="discount">Sconto %</option>
          <option value="price">Prezzo</option>
        </select>
        <select id="mind">
          <option value="0">Sconto ≥0%</option>
          <option value="20">≥20%</option>
          <option value="30">≥30%</option>
          <option value="50">≥50%</option>
        </select>
        <button id="gear" class="gearbtn hidden" title="Token CardTrader">⚙️</button>
      </div>
    </div>
    <div class="settings hidden" id="settings">
      <input id="cttoken" type="password" placeholder="Il tuo token API CardTrader"
        autocomplete="off" />
      <button id="savetoken" class="addcart">Salva</button>
      <div class="msg" id="settingsmsg">
        Il token resta salvato solo sul tuo account Telegram: ognuno usa il proprio carrello.
      </div>
    </div>
  </header>
  <main id="list"><div class="empty">Caricamento…</div></main>

  <script>
    "use strict";
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // URL dei dati: la Edge Function inietta il path assoluto dello Storage al posto
    // del placeholder; se servito direttamente dallo Storage (dev) resta il relativo.
    const DEALS_URL = "https://udjsiborxgzawvhbfvdj.supabase.co/storage/v1/object/public/webapp/deals.json".indexOf("__") === 0 ? "./deals.json" : "https://udjsiborxgzawvhbfvdj.supabase.co/storage/v1/object/public/webapp/deals.json";
    // Endpoint Edge Function per aggiungere al carrello CardTrader (baked a build time).
    // Il bottone 🛒 esiste solo dentro Telegram: serve initData per autenticarsi.
    const CART_URL = "https://udjsiborxgzawvhbfvdj.supabase.co/functions/v1/cart".indexOf("__") === 0 ? "" : "https://udjsiborxgzawvhbfvdj.supabase.co/functions/v1/cart";
    const cartEnabled = Boolean(CART_URL && tg && tg.initData);

    const state = { deals: [], q: "", lang: "", sort: "margin", mind: 0, open: {} };
    const fmt = (n) => "€" + Number(n).toFixed(2);
    const pct = (d) => Math.round(d * 100);

    function openBuy(url) {
      if (tg && tg.openLink) tg.openLink(url); else window.open(url, "_blank");
    }

    // Filtri Cardmarket precompilati: lingua inglese + condizione minima NM.
    function cmFiltered(url) {
      if (!url || url.indexOf("cardmarket.com") === -1) return url;
      return url + (url.indexOf("?") === -1 ? "?" : "&") + "language=1&minCondition=2";
    }

    // Token API CardTrader PER-UTENTE, salvato in locale (CloudStorage Telegram:
    // segue l'account, non il dispositivo). Mai inviato altrove se non alla
    // Edge Function `cart`, che lo inoltra a CardTrader.
    const TOKEN_KEY = "ct_token";
    let ctToken = "";

    function loadToken(cb) {
      if (tg && tg.CloudStorage && tg.CloudStorage.getItem) {
        tg.CloudStorage.getItem(TOKEN_KEY, (err, value) => cb(err ? "" : (value || "")));
      } else {
        try { cb(localStorage.getItem(TOKEN_KEY) || ""); } catch (e) { cb(""); }
      }
    }

    function storeToken(value, cb) {
      if (tg && tg.CloudStorage && tg.CloudStorage.setItem) {
        tg.CloudStorage.setItem(TOKEN_KEY, value, (err, ok) => cb(!err && ok !== false));
      } else {
        try { localStorage.setItem(TOKEN_KEY, value); cb(true); } catch (e) { cb(false); }
      }
    }

    function apply() {
      const q = state.q.trim().toLowerCase();
      let items = state.deals.filter((d) => {
        if (state.lang && (d.lang || "") !== state.lang) return false;
        if (pct(d.discount) < state.mind) return false;
        if (q) {
          const hay = ((d.card || "") + " " + (d.set || "") + " " + (d.number || "")).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      const cmp = {
        margin: (a, b) => b.margin - a.margin,
        discount: (a, b) => b.discount - a.discount,
        price: (a, b) => a.price - b.price,
      }[state.sort];
      items.sort(cmp);
      render(items);
    }

    function groupBySet(items) {
      const map = new Map();
      for (const d of items) {
        const key = d.set || "—";
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(d);
      }
      // ordina i set per margine massimo al loro interno
      return [...map.entries()].sort((a, b) => {
        const ma = Math.max(...a[1].map((x) => x.margin));
        const mb = Math.max(...b[1].map((x) => x.margin));
        return mb - ma;
      });
    }

    function render(items) {
      const list = document.getElementById("list");
      if (!items.length) {
        list.innerHTML = '<div class="empty">Nessuna occasione con questi filtri.</div>';
        return;
      }
      const groups = groupBySet(items);
      let html = "";
      for (const [set, cards] of groups) {
        const isOpen = state.open[set] !== false; // default aperto
        html += '<div class="set-group">';
        html += '<div class="set-head" data-set="' + esc(set) + '">' +
          '<span class="name">' + esc(set) + "</span>" +
          '<span class="cnt">' + cards.length + " · max +" + fmt(Math.max(...cards.map(c => c.margin))) + "</span>" +
          "</div>";
        html += '<div class="cards ' + (isOpen ? "" : "hidden") + '">';
        for (const d of cards) {
          const cartBtn = cartEnabled && d.listing_id
            ? '<button class="addcart" data-id="' + d.listing_id + '" data-ctz="' +
              (d.ct_zero ? "1" : "0") + '" title="Aggiungi al carrello">🛒</button>'
            : "";
          const info = [
            d.ref ? "rif. prezzo: " + esc(d.ref) : "",
            d.country ? "venditore da: " + esc(d.country) : "",
            "CT Zero: " + (d.ct_zero ? "sì" : "no"),
          ].filter(Boolean).join(" · ");
          html += '<div class="card">' +
            '<div class="row1"><span class="cn">' + esc(d.card || "") +
            ' <span class="num">#' + esc(d.number || "") + "</span></span>" +
            '<span class="badge">-' + pct(d.discount) + "% · +" + fmt(d.margin) + "</span>" +
            cartBtn + "</div>" +
            '<div class="row2"><span class="price">' + fmt(d.price) + "</span> · " +
            '<span class="strike">' + fmt(d.market) + "</span> · " +
            esc(d.cond || "") + " · " + esc(d.lang || "") + " · " + esc(d.seller || "n/d") +
            "</div>" +
            (d.warnings && d.warnings.length
              ? '<div class="warn">⚠️ verifica a mano: ' + esc(d.warnings.join(", ")) + "</div>"
              : "") +
            '<div class="detail hidden">' +
            '<div class="info">' + info + "</div>" +
            (d.url
              ? '<button class="openct" data-url="' + esc(cmFiltered(d.url)) +
                '">Apri su Cardmarket ↗</button>'
              : "") +
            "</div>" +
            "</div>";
        }
        html += "</div></div>";
      }
      list.innerHTML = html;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    async function addToCart(btn) {
      if (!ctToken) {
        openSettings("Prima imposta il tuo token API CardTrader.");
        return;
      }
      const productId = Number(btn.getAttribute("data-id"));
      const ctZero = btn.getAttribute("data-ctz") === "1";
      btn.disabled = true;
      btn.textContent = "⏳";
      try {
        const res = await fetch(CART_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            init_data: tg.initData, ct_token: ctToken,
            product_id: productId, quantity: 1, ct_zero: ctZero,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || ("HTTP " + res.status));
        btn.textContent = "✅";
        btn.classList.add("done");
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "🛒";
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        const msg = "Non aggiunto al carrello: " + err.message;
        if (tg.showAlert) tg.showAlert(msg); else console.error(msg);
      }
    }

    document.getElementById("list").addEventListener("click", (e) => {
      const cart = e.target.closest(".addcart");
      if (cart) {
        e.preventDefault();
        e.stopPropagation();
        if (!cart.disabled) addToCart(cart);
        return;
      }
      const head = e.target.closest(".set-head");
      if (head) {
        const set = head.getAttribute("data-set");
        state.open[set] = state.open[set] === false; // toggle
        apply();
        return;
      }
      const open = e.target.closest(".openct");
      if (open) {
        const url = open.getAttribute("data-url");
        if (url) openBuy(url);
        return;
      }
      // Il tap sulla card espande il dettaglio inline, senza uscire dall'app.
      const card = e.target.closest(".card");
      if (card) {
        const detail = card.querySelector(".detail");
        if (detail) detail.classList.toggle("hidden");
      }
    });

    function openSettings(message) {
      document.getElementById("settings").classList.remove("hidden");
      if (message) document.getElementById("settingsmsg").textContent = message;
    }

    function saveToken() {
      const input = document.getElementById("cttoken");
      const msg = document.getElementById("settingsmsg");
      const token = input.value.trim();
      if (token.length < 20) {
        msg.textContent = "Token troppo corto: copia il token API dal tuo profilo CardTrader.";
        return;
      }
      storeToken(token, (ok) => {
        if (!ok) {
          msg.textContent = "❌ Salvataggio non riuscito, riprova.";
          return;
        }
        ctToken = token;
        input.value = "";
        msg.textContent = "✅ Token salvato: il 🛒 userà il tuo carrello.";
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      });
    }

    if (cartEnabled) {
      document.getElementById("gear").classList.remove("hidden");
      loadToken((value) => { ctToken = value; });
    }

    const on = (id, ev, fn) => document.getElementById(id).addEventListener(ev, fn);
    on("q", "input", (e) => { state.q = e.target.value; apply(); });
    on("lang", "change", (e) => { state.lang = e.target.value; apply(); });
    on("sort", "change", (e) => { state.sort = e.target.value; apply(); });
    on("mind", "change", (e) => { state.mind = Number(e.target.value); apply(); });
    on("gear", "click", () => document.getElementById("settings").classList.toggle("hidden"));
    on("savetoken", "click", saveToken);

    async function load() {
      try {
        const res = await fetch(DEALS_URL + "?t=" + Date.now());
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        state.deals = data.deals || [];
        const when = data.generated_at ? new Date(data.generated_at).toLocaleString("it-IT") : "—";
        document.getElementById("meta").textContent =
          (data.count || 0) + " occasioni · aggiornato " + when;
        apply();
      } catch (err) {
        document.getElementById("list").innerHTML =
          '<div class="error">Impossibile caricare le occasioni.<br>' + esc(err.message) + "</div>";
        document.getElementById("meta").textContent = "Errore di caricamento";
      }
    }
    load();
  </script>
</body>
</html>
